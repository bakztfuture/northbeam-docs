[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "northbeam-docs-backend"
version = "0.1.0"
description = "Docs studio API: drafts, immutable published snapshots, and a public reader"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.migrations" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection relies on Depends(...) as a default argument.
extend-immutable-calls = ["fastapi.Depends"]
